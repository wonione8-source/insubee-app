<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1"><title>인슈비 — 마이페이지</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"></head><body>
<!-- HEADER -->
  <header class="site-header">
    <div class="site-header-inner">
      <a href="/" class="site-logo"><img src="logo.png" alt="인슈비" style="height:36px;"></a>
      <nav class="site-nav">
        <a href="agents.html">고객 상담신청</a>
        <a href="https://insubee.kr" target="_blank">보험뉴스</a>
        <a href="dashboard.html" class="btn-register">대시보드</a>
      </nav>
      <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
    </div>
    <div id="mobileMenu" class="mobile-menu">
      <a href="agents.html">고객 상담신청</a>
      <a href="https://insubee.kr" target="_blank">보험뉴스</a>
      <a href="dashboard.html" class="highlight">대시보드 →</a>
    </div>
  </header>
<div class="page-container" style="max-width:520px">
  <div id="loading" class="spinner"></div>
  <div id="content" class="hidden">
    <div class="profile-header">
      <div class="profile-avatar" id="avatar">?</div>
      <div class="profile-name" id="pname"></div>
      <p class="text-sm text-muted mt-8" id="prole"></p>
    </div>
    <div class="card mb-16">
      <div class="form-group"><label class="form-label">이메일</label><div id="pemail" style="font-size:15px"></div></div>
      <div class="form-group"><label class="form-label">전화번호</label><div id="pphone" style="font-size:15px"></div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <a href="dashboard.html" class="btn btn-navy btn-block">대시보드로 이동</a>
      <button class="btn btn-outline btn-block" onclick="signOut()">로그아웃</button>
    </div>
  </div>
</div>
<!-- FOOTER -->
  <footer class="site-footer">
    <div class="site-footer-inner">
      <div class="footer-top">
        <div><div class="footer-brand">인슈비 InsuBee</div><p>내가 원할 때, 전문가를 만나는 보험 플랫폼</p></div>
        <div class="footer-links"><a href="privacy.html">개인정보처리방침</a><a href="terms.html">이용약관</a><a href="https://insubee.kr" target="_blank">인슈비뉴스</a></div>
      </div>
      <div class="footer-info">원니원주식회사 | 대표 김성원<br>인천광역시 남동구 남동대로 199번길 96, 202호<br>사업자등록번호: 686-86-03106 | 고객상담실: 070-4147-8887<br>© 2026 원니원주식회사. All rights reserved.</div>
    </div>
  </footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script>
<script>function toggleMobileMenu(){const m=document.getElementById("mobileMenu");m.style.display=m.style.display==="none"||!m.style.display?"block":"none"}document.querySelectorAll("#mobileMenu a").forEach(l=>l.addEventListener("click",()=>document.getElementById("mobileMenu").style.display="none"));</script>
<script>
(async()=>{const user=await requireAuth();if(!user)return;const p=await getCurrentProfile();if(!p)return;
document.getElementById('loading').style.display='none';document.getElementById('content').classList.remove('hidden');
document.getElementById('avatar').textContent=(p.name||'?')[0];document.getElementById('pname').textContent=p.name||'사용자';
document.getElementById('prole').textContent=p.role==='agent'?'보험설계사':'일반 고객';
document.getElementById('pemail').textContent=user.email||'-';document.getElementById('pphone').textContent=p.phone||'-'})();
</script></body></html>
