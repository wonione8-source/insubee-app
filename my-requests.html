<!-- HEADER -->
  <header class="site-header">
    <div class="site-header-inner">
      <a href="/" class="site-logo"><div class="site-logo-icon">비</div>인슈비</a>
      <nav class="site-nav">
        <a href="agents.html">고객 상담신청</a>

      <a href="dashboard.html" class="highlight">대시보드 →</a>
    </div>
  </header>
<div class="page-container">
  <h1 class="page-title">내 상담 요청</h1>
  <p class="page-subtitle">설계사에게 보낸 상담 요청을 관리하세요</p>
  <div class="tab-group">
    <div class="tab-item active" onclick="filterRequests('all')">전체</div>
    <div class="tab-item" onclick="filterRequests('pending')">대기중</div>
    <div class="tab-item" onclick="filterRequests('active')">진행중</div>
    <div class="tab-item" onclick="filterRequests('done')">완료</div>
  </div>
  <div id="requests-list"><div class="spinner"></div></div>
</div>
<!-- FOOTER -->
  <footer class="site-footer">
    <div class="site-footer-inner">
      <div class="footer-top">
        <div><div class="footer-brand">인슈비 InsuBee</div><p>내가 원할 때, 전문가를 만나는 보험 플랫폼</p></div>
        <div class="footer-links"><a href="privacy.html">개인정보처리방침</a><a href="terms.html">이용약관</a><a href="https://insubee.kr" target="_blank">인슈비뉴스</a></div>

    </div>
  </footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script>
<script>function toggleMobileMenu(){const m=document.getElementById("mobileMenu");m.style.display=m.style.display==="none"||!m.style.display?"block":"none"}document.querySelectorAll("#mobileMenu a").forEach(l=>l.addEventListener("click",()=>document.getElementById("mobileMenu").style.display="none"));</script>
<script>
let allRequests=[];
(async()=>{const user=await requireAuth();if(!user)return;allRequests=await getMyRequests();renderRequests(allRequests)})();
function filterRequests(f){document.querySelectorAll('.tab-item').forEach((t,i)=>t.classList.toggle('active',['all','pending','active','done'][i]===f));
let filtered=allRequests;if(f==='pending')filtered=allRequests.filter(r=>r.status==='pending');else if(f==='active')filtered=allRequests.filter(r=>['accepted','in_progress'].includes(r.status));else if(f==='done')filtered=allRequests.filter(r=>['completed','cancelled','rejected'].includes(r.status));renderRequests(filtered)}
function renderRequests(list){const c=document.getElementById('requests-list');if(list.length===0){c.innerHTML='<div class="empty-state"><i class="ti ti-message-off"></i><p>상담 요청이 없습니다</p></div>';return}
c.innerHTML=list.map(r=>'<div class="card"><div class="flex-between"><div><div style="font-weight:700;font-size:15px">'+r.agents.profiles.name+' 설계사</div><div class="text-sm text-muted">'+(r.agents.company||'')+' · '+(r.insurance_type||'보험상담')+'</div></div><span class="status '+getStatusClass(r.status)+'">'+getStatusLabel(r.status)+'</span></div><div class="text-sm text-muted mt-8">'+timeAgo(r.created_at)+'</div></div>').join('')}
</script></body></html>
