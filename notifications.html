<script>function toggleMobileMenu(){const m=document.getElementById("mobileMenu");m.style.display=m.style.display==="none"||!m.style.display?"block":"none"}document.querySelectorAll("#mobileMenu a").forEach(l=>l.addEventListener("click",()=>document.getElementById("mobileMenu").style.display="none"));</script>
<script>
(async()=>{const user=await requireAuth();if(!user)return;const notifs=await getNotifications();const c=document.getElementById('notif-list');
if(notifs.length===0){c.innerHTML='<div class="empty-state"><i class="ti ti-bell-off"></i><p>알림이 없습니다</p></div>';return}
c.innerHTML=notifs.map(n=>'<div class="notif-item'+(n.is_read?'':' unread')+'" onclick="markRead(\''+n.id+'\')"><div class="notif-icon match"><i class="ti ti-bell"></i></div><div class="notif-content"><div class="notif-title">'+n.title+'</div>'+(n.body?'<div class="notif-body">'+n.body+'</div>':'')+'<div class="notif-time">'+timeAgo(n.created_at)+'</div></div></div>').join('')})();
async function markRead(id){await markNotificationRead(id);location.reload()}
async function readAll(){await markAllNotificationsRead();location.reload()}
</script></body></html>
