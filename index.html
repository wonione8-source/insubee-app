<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>인슈비 — 나에게 맞는 보험설계사를 찾아보세요</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <style>
    .landing {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: var(--max-width);
      margin: 0 auto;
      background: #fff;
    }
    .landing-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 24px;
    }
    .landing-logo {
      font-size: 48px;
      font-weight: 900;
      color: var(--primary);
      letter-spacing: -1px;
      margin-bottom: 12px;
    }
    .landing-logo span { color: var(--secondary); }
    .landing-desc {
      font-size: 16px;
      color: var(--gray-500);
      line-height: 1.7;
      margin-bottom: 36px;
    }
    .landing-features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-bottom: 36px;
    }
    .feature-card {
      background: var(--gray-50);
      border-radius: var(--radius);
      padding: 20px 16px;
      text-align: center;
    }
    .feature-card i {
      font-size: 28px;
      color: var(--primary);
      margin-bottom: 8px;
      display: block;
    }
    .feature-card .title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .feature-card .desc {
      font-size: 12px;
      color: var(--gray-500);
    }
    .landing-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .landing-footer {
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--gray-400);
    }
  </style>
</head>
<body>
  <div class="landing" id="landing">
    <div class="landing-hero">
      <div class="landing-logo">인슈<span>비</span></div>
      <p class="landing-desc">
        나에게 딱 맞는 보험설계사를 찾고<br>
        무료로 전문 상담을 받아보세요
      </p>

      <div class="landing-features">
        <div class="feature-card">
          <i class="ti ti-search"></i>
          <div class="title">설계사 검색</div>
          <div class="desc">지역·전문 분야별 검색</div>
        </div>
        <div class="feature-card">
          <i class="ti ti-message-circle"></i>
          <div class="title">무료 상담</div>
          <div class="desc">원하는 설계사에게 직접 요청</div>
        </div>
        <div class="feature-card">
          <i class="ti ti-star"></i>
          <div class="title">평점·리뷰</div>
          <div class="desc">실제 고객의 후기 확인</div>
        </div>
        <div class="feature-card">
          <i class="ti ti-shield-check"></i>
          <div class="title">검증된 설계사</div>
          <div class="desc">등록번호 인증 설계사만</div>
        </div>
      </div>

      <div class="landing-actions">
        <a href="/login.html" class="btn btn-primary btn-lg btn-block">시작하기</a>
        <a href="/login.html" class="btn btn-outline btn-lg btn-block">이미 계정이 있어요</a>
      </div>
    </div>

    <div class="landing-footer">
      © 2026 원니원주식회사 · <a href="/terms.html" style="color:inherit">이용약관</a> · <a href="/privacy.html" style="color:inherit">개인정보처리방침</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    // 이미 로그인 된 사용자는 대시보드로
    (async () => {
      const user = await getCurrentUser();
      if (user) location.href = '/dashboard.html';
    })();
  </script>
</body>
</html>
