<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script>
<script>function toggleMobileMenu(){const m=document.getElementById("mobileMenu");m.style.display=m.style.display==="none"||!m.style.display?"block":"none"}document.querySelectorAll("#mobileMenu a").forEach(l=>l.addEventListener("click",()=>document.getElementById("mobileMenu").style.display="none"));</script>
<script>
(async()=>{const user=await requireAuth();if(!user)return;const requests=await getReceivedRequests();const c=document.getElementById('requests-list');
if(requests.length===0){c.innerHTML='<div class="empty-state"><i class="ti ti-inbox"></i><p>아직 받은 요청이 없습니다</p></div>';return}
c.innerHTML=requests.map(r=>'<div class="card"><div class="flex-between"><div><div style="font-weight:700;font-size:15px">'+r.customers.profiles.name+' 고객</div><div class="text-sm text-muted">'+(r.insurance_type||'보험상담')+' · '+(r.customers.region_sido||'')+'</div></div><span class="status '+getStatusClass(r.status)+'">'+getStatusLabel(r.status)+'</span></div>'+(r.message?'<div class="text-sm mt-8" style="color:var(--gray-600)">"'+r.message.slice(0,80)+'"</div>':'')+
(r.status==='pending'?'<div class="request-actions"><button class="btn btn-navy btn-sm" onclick="respond(\''+r.id+'\',\'accepted\')">수락</button><button class="btn btn-outline btn-sm" onclick="respond(\''+r.id+'\',\'rejected\')">거절</button></div>':'')+
'<div class="text-sm text-muted mt-8">'+timeAgo(r.created_at)+'</div></div>').join('')})();
async function respond(id,status){try{await respondToRequest(id,status,'');showToast(status==='accepted'?'수락했습니다':'거절했습니다');setTimeout(()=>location.reload(),1000)}catch(e){showToast(e.message)}}
</script></body></html>
